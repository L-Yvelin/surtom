name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Build all workspaces
        run: npm run build

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Prettier
        run: npx prettier --check .
      - name: ESLint (design system)
        run: npm run lint --workspace=surtom-design-system
      - name: ESLint (front)
        run: npm run lint --workspace=front
      - name: Secretlint
        run: npm run lint:secrets

  test-design-system:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Jest (design system)
        run: npm run test --workspace=surtom-design-system

  test-front:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Build interfaces
        run: npm run build --workspace=interfaces
      - name: Build design system
        run: npm run build --workspace=surtom-design-system
      - name: Jest (front)
        run: npm run test --workspace=front

  test-back:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Build interfaces
        run: npm run build --workspace=interfaces
      - name: Jest (back)
        run: npm run test --workspace=back
